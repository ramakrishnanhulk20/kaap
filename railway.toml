# How Railway builds and runs Kaap's watcher. The site is hosted elsewhere and does not read this.
# The watcher's settings are Railway variables, its key is a file on the service's volume, and
# packages/worker/HOSTING.md has the steps.

[build]
builder = "DOCKERFILE"
dockerfilePath = "packages/worker/Dockerfile"

[deploy]
healthcheckPath = "/status"
healthcheckTimeout = 120
restartPolicyType = "ALWAYS"
