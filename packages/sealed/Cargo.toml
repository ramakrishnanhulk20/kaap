[package]
name = "kaap-sealed"
description = "The sealed job that judges a proposal inside OutLayer's Intel TDX hardware and signs the verdict."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The judgement logic is plain Rust that `cargo test` runs natively against recorded fixtures.
# Only the wasm32-wasip2 component talks to OutLayer's host and the network.
[dependencies]
kaap-core = { path = "../core" }
serde.workspace = true
# raw_value hands over the exact bytes of the proposal's `kind`, which the verdict hashes and
# the guard forwards unchanged (C5). It adds a type and changes no other parsing.
serde_json = { workspace = true, features = ["raw_value"] }
sha2.workspace = true
base64.workspace = true
bs58.workspace = true
near-account-id = { version = "=3.0.0", default-features = false }
# The checks behind "AI verified" (C11). Pure Rust with no network code inside: the job fetches
# every piece of evidence itself and these crates only check it. Versions from the 23 Oct spike
# (scratchpad/m0d-nearai), each the latest stable on 2 Nov 2026 and each built for wasm32-wasip2.
# dcap-qvl without `report`, which would pull in reqwest.
dcap-qvl = { version = "=0.7.1", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
p384 = { version = "=0.14.0", default-features = false, features = ["ecdsa", "alloc"] }
rsa = { version = "=0.9.10", default-features = false, features = ["std", "u64_digit"] }
# rsa 0.9 is built on digest 0.10, so Intel's PS384 needs sha2 0.10; everything else here hashes
# with the workspace's sha2 0.11.
sha2-digest10 = { package = "sha2", version = "=0.10.9" }
ed25519-dalek = { version = "=3.0.0", default-features = false }
hex = "=0.4.3"
# Intel sends its certificate chains URL-encoded in response headers.
urlencoding = "=2.1.3"
# Intel's collateral dates are RFC 3339; already in the build through dcap-qvl.
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }
# The sealed text channel (C26): the construction OutLayer's own secrets use, X25519, HKDF-SHA256
# and ChaCha20-Poly1305. Each is the latest stable on 5 Nov 2026; x25519-dalek 3.0.0 is the 23 Oct
# spike's version and shares curve25519-dalek 5 with ed25519-dalek.
x25519-dalek = { version = "=3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }
hkdf = { version = "=0.13.0", default-features = false }
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["alloc"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
outlayer = { version = "=0.2.1", features = ["signing-keys", "encryption-keys"] }
# The WASI bindings wasi-http-client 0.2.1 wraps. Called directly because that crate sets only
# a connect timeout, and every outside call here needs a first-byte, a between-bytes and an
# overall deadline (standard 4). 0.13.3 is the version OutLayer's worker ran in the M0 spikes.
wasi = "=0.13.3"

[dev-dependencies]
borsh.workspace = true
ed25519-dalek = "=3.0.0"

[features]
# A build for plain wasmtime: the OutLayer host calls are answered from a recorded fixture file
# and the verdict is signed with a fixed test key. Never published.
local = []
