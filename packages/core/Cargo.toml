[package]
name = "kaap-core"
description = "Decides what a NEAR Sputnik DAO proposal really does, and re-exports kaap-verdict's canonical encoding of a Kaap verdict."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# No std::time, no network and no randomness anywhere in this crate, so it builds unchanged for
# native, wasm32-unknown-unknown (browser, worker bridge) and wasm32-wasip2 (the sealed job).
[dependencies]
kaap-verdict = { path = "../verdict" }
borsh.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
bs58.workspace = true
base64.workspace = true
num-bigint.workspace = true
unicode-normalization.workspace = true
