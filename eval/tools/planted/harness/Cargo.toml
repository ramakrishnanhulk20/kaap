[package]
name = "kaap-planted-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
publish = false
description = "Files every planted Kaap evaluation record on the real Sputnik DAO 3.2 contract in a local sandbox and recomputes every NEP-413 hash."

# An empty workspace table makes this crate a workspace of its own, so cargo never reads or
# rewrites the repo's root workspace or its lock file. This crate keeps its own Cargo.lock.
[workspace]

[dependencies]

[dev-dependencies]
near-sandbox = "=0.3.16"
# near-api 0.8.3 asks for near-api-types ^0.8.3, and a fresh resolve picks a newer 0.8.x that
# near-api 0.8.3 does not compile against. Sputnik's own lock file holds both at 0.8.3.
near-api = { version = "=0.8.3", default-features = false }
near-api-types = "=0.8.3"
tokio = { version = "=1.54.0", features = ["macros", "rt-multi-thread"] }
serde_json = "=1.0.154"
anyhow = "=1.0.104"
# For the NEP-413 hash recomputation.
sha2 = "=0.9.9"
hex = "=0.4.3"
base64 = "=0.22.1"
